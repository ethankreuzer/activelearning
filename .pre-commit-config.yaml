repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-yaml
        name: check yaml (mkdocs)
        args: [--unsafe]
        files: ^mkdocs\.yml$
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        # ampc_hitrate_fits/data/ holds score/pProp reference tables the DOCK3
        # oracle needs at runtime: full_scores.df is 540 KB and
        # full_scores_1p47b.df is 2.3 MB, both over the 500 KB default.
        args: ['--maxkb=2400']
      - id: check-case-conflict

  # Jupyter Notebook cleaning
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ['--config', '.codespellrc']

  # Security (Secrets detection)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # --- Python: All-in-one (Lint + Format + Imports) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      # Run the linter (replaces flake8 & isort)
      - id: ruff
        args: [--fix]
      # Run the formatter (replaces black)
      - id: ruff-format
